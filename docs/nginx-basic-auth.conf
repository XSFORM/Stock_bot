# Sample nginx configuration for Stock Bot with HTTP Basic Auth.
#
# NOTE: install.sh now sets this up automatically when run interactively.
# Use this file as a reference or for manual / customised deployments.
# For a fully automated setup, see: scripts/setup-https.sh
#
# Manual steps:
#   1. Copy to /etc/nginx/sites-available/stockweb
#   2. Replace YOUR_DOMAIN_OR_IP with your domain name or public IP address.
#   3. Replace /etc/nginx/.htpasswd with the path to your htpasswd file
#      (created with: sudo htpasswd -c /etc/nginx/.htpasswd myuser).
#   4. The app (stockweb service) listens on port 8000.
#   5. Enable: sudo ln -s /etc/nginx/sites-available/stockweb /etc/nginx/sites-enabled/
#   6. Test:   sudo nginx -t
#   7. Reload: sudo systemctl reload nginx
#
# For HTTPS support, run: sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # HTTP Basic Auth — protect the ERP/admin UI by default.
    auth_basic "Stock Bot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Pocket Price PWA — token-based access, no Basic Auth prompt.
    location /price {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pocket Price API — token-based access, no Basic Auth prompt.
    location /api/price {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets (icons, images) used by Pocket Price PWA.
    location /static/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other routes (ERP UI, admin, products, stock, …) — Basic Auth required.
    location / {
        proxy_pass http://127.0.0.1:8000;

        # Forward real client information to the FastAPI app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
