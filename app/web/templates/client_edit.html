{% extends "base.html" %}
{% block content %}
<div class="bg-white p-3 rounded shadow-sm" style="max-width: 720px;">
  <h4>{{ t.clients_edit_title }}</h4>

  {% if request.query_params.get('msg') %}
    <div class="alert alert-info">{{ request.query_params.get('msg') }}</div>
  {% endif %}

  <form method="post" action="/clients/{{ client.id }}/edit">
    <div class="mb-2">
      <label class="form-label">{{ t.lbl_name }}</label>
      <input class="form-control" name="name" value="{{ client.name }}" required>
    </div>
    <div class="mb-2">
      <label class="form-label">{{ t.lbl_phone }}</label>
      <input class="form-control" name="phone" value="{{ client.phone }}">
    </div>
    <div class="mb-2">
      <label class="form-label">{{ t.lbl_note }}</label>
      <textarea class="form-control" name="note" rows="4">{{ client.note }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ t.clients_type_label | default('Тип клиента') }}</label>
      {% set _ct = client.client_type or 'wholesale' %}
      <select class="form-select" name="client_type">
        <option value="wholesale" {% if _ct == 'wholesale' %}selected{% endif %}>📦 {{ t.clients_tab_wholesale | default('Оптовик') }}</option>
        <option value="retail" {% if _ct == 'retail' %}selected{% endif %}>🛒 {{ t.clients_tab_retail | default('Штучный') }}</option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary">{{ t.btn_save }}</button>
      <a class="btn btn-outline-secondary" href="/clients">{{ t.clients_back }}</a>
    </div>
  </form>
</div>
{% endblock %}
