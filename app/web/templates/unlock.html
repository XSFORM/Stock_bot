<!doctype html>
<html lang="{{ ui_lang }}" data-bs-theme="{{ 'dark' if ui_theme == 'dark' else 'light' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ t.unlock_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/site.css">
    {% if ui_theme == "system" %}
    <script>
      (function(){
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      })();
    </script>
    {% endif %}
  </head>
  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="min-width:320px;max-width:400px;width:100%">
      <h4 class="card-title mb-3 text-center">🔒 {{ t.unlock_heading }}</h4>
      <p class="text-muted small text-center mb-3">{{ t.unlock_prompt }}</p>
      {% if error %}
      <div class="alert alert-danger py-2 small">{{ t.unlock_error }}</div>
      {% endif %}
      <form method="post" action="/unlock">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <input type="password" name="password" class="form-control"
                 placeholder="{{ t.unlock_password_placeholder }}"
                 autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-100">{{ t.unlock_submit }}</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
