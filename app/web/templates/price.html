<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pocket Price</title>
  <link rel="manifest" href="/price/manifest.webmanifest">
  <meta name="theme-color" content="#0d47a1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0a0f28;
      background-image:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("/static/price-bg.jpg?v=2");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .card { background: rgba(15,30,70,0.85); border: none; backdrop-filter: blur(4px); }
    .form-control, .form-select { background: rgba(15,52,96,0.85); border-color: #444; color: #e0e0e0; }
    .form-control:focus, .form-select:focus { background: rgba(15,52,96,0.95); color: #e0e0e0; border-color: #4a9eff; box-shadow: none; }
    .form-control::placeholder { color: #888; }
    #scanner-wrapper { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
    #scanner-video { width: 100%; border-radius: 8px; }
    #scanner-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    #scanner-line {
      width: 70%; height: 2px; background: #ff4444;
      animation: scan 2s linear infinite;
    }
    @keyframes scan { 0%,100%{top:20%} 50%{top:80%} }
    .price-card { background: rgba(15,52,96,0.85); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; backdrop-filter: blur(4px); }
    .price-card .prod-name { font-size: 1rem; font-weight: 600; }
    .price-card .prod-sub { font-size: 0.8rem; color: #aaa; }
    .price-big { font-size: 1.4rem; font-weight: 700; color: #4aff91; }
    .price-small { font-size: 0.9rem; color: #aaa; }
    #scan-status { font-size: 0.85rem; color: #ffc107; min-height: 1.4em; }
    .result-list-item {
      background: rgba(15,52,96,0.82); border-radius: 8px; padding: 10px 14px;
      margin-bottom: 8px; cursor: pointer; border: 1px solid transparent;
      backdrop-filter: blur(4px);
    }
    .result-list-item:hover { border-color: #4a9eff; }
    .result-list-item .item-title { font-weight: 600; font-size: 0.95rem; }
    .result-list-item .item-sub { font-size: 0.8rem; color: #aaa; }
    #back-btn { display: none; }
  </style>
</head>
<body>
<div class="container-fluid py-3" style="max-width:600px">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="mb-0 fw-bold">📱 Pocket Price</h5>
    <button id="back-btn" class="btn btn-sm btn-outline-secondary" onclick="showList()">← Back</button>
  </div>

  <div id="not-paired" class="alert alert-warning">
    🔒 Not paired. Ask admin for an access link.
  </div>

  <!-- App shell (hidden by default; JS shows when token is present) -->
  <div id="app-shell" style="display:none">
    <!-- Search row -->
    <div class="input-group mb-2">
      <input id="search-input" type="search" class="form-control" placeholder="Search by model / brand / name…" autocomplete="off">
      <button class="btn btn-outline-secondary" type="button" id="btn-scan" onclick="startScan()">📷</button>
    </div>
    <div id="scan-status"></div>

    <!-- Scanner -->
    <div id="scanner-area" style="display:none" class="mb-3">
      <div id="scanner-wrapper">
        <video id="scanner-video" autoplay muted playsinline></video>
        <div id="scanner-overlay"><div id="scanner-line" style="position:absolute;left:15%;right:15%;top:50%;height:2px;background:#ff4444"></div></div>
      </div>
      <button class="btn btn-sm btn-outline-danger mt-2" onclick="stopScan()">✕ Cancel scan</button>
    </div>

    <!-- Results: list of matching products -->
    <div id="results"></div>

    <!-- Price detail view (hidden until product selected) -->
    <div id="price-detail" style="display:none"></div>
  </div>
</div>

<noscript>
  <div style="padding:20px;color:#e0e0e0;background:#1a1a2e;min-height:100vh">
    <h5>📱 Pocket Price</h5>
    <p>JavaScript is required for this app. Please enable JavaScript in your browser.</p>
  </div>
</noscript>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── Token management ──────────────────────────────────────────────────────────
var _token = '';
var _deviceId = '';
var _mode = 'SIMPLE';
var _showQty = false;
var _showBuyPrice = false;
var _qtyLabel = {{ (t.price_qty_label if t is defined and t.price_qty_label is defined else 'Qty') | tojson }};
var _buyPriceLabel = {{ (t.price_buy_price_label if t is defined and t.price_buy_price_label is defined else 'Incoming') | tojson }};
var _stream = null;
var _scanInterval = null;
var _lastResults = [];

(function() {
  // Generate or restore persistent device UUID
  try {
    _deviceId = localStorage.getItem('pocket_price_device_id') || '';
    if (!_deviceId) {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        _deviceId = crypto.randomUUID();
      } else if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        // Cryptographically secure UUID v4 fallback
        var buf = new Uint8Array(16);
        crypto.getRandomValues(buf);
        buf[6] = (buf[6] & 0x0f) | 0x40;
        buf[8] = (buf[8] & 0x3f) | 0x80;
        var hex = Array.from(buf).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        _deviceId = hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);
      } else {
        // Last-resort fallback (non-cryptographic, very old browsers)
        _deviceId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0;
          var v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }
      localStorage.setItem('pocket_price_device_id', _deviceId);
    }
  } catch(e) {}

  // Read token from URL query param first
  var params = new URLSearchParams(window.location.search);
  var urlToken = params.get('token');
  if (urlToken && /^[A-Za-z0-9_\-]{8,128}$/.test(urlToken)) {
    try { localStorage.setItem('pocket_price_token', urlToken); } catch(e) {}
    _token = urlToken;
    // Remove token from URL to keep it clean
    params.delete('token');
    var newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    history.replaceState(null, '', newUrl);
  } else {
    try { _token = localStorage.getItem('pocket_price_token') || ''; } catch(e) {}
  }
  if (_token) {
    fetchTokenInfo();
  }
  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/price/sw.js', {scope: '/price'}).catch(function(){});
  }
})();

function _priceHeaders() {
  var h = {'X-Price-Token': _token};
  if (_deviceId) h['X-Price-Device'] = _deviceId;
  return h;
}

async function fetchTokenInfo() {
  try {
    var res = await fetch('/api/price/token-info', {
      headers: _priceHeaders()
    });
    if (res.status === 401) { showUnpaired(); return; }
    var data = await res.json();
    _mode = (data.mode === 'FULL') ? 'FULL' : 'SIMPLE';
    _showQty = data.show_qty === true;
    _showBuyPrice = data.show_buy_price === true;
  } catch(e) {
    // Offline: use cached mode or default SIMPLE
    try { _mode = localStorage.getItem('pocket_price_mode') || 'SIMPLE'; } catch(e2) {}
    try { _showQty = localStorage.getItem('pocket_price_show_qty') === '1'; } catch(e2) {}
    try { _showBuyPrice = localStorage.getItem('pocket_price_show_buy_price') === '1'; } catch(e2) {}
  }
  try { localStorage.setItem('pocket_price_mode', _mode); } catch(e) {}
  try { localStorage.setItem('pocket_price_show_qty', _showQty ? '1' : '0'); } catch(e) {}
  try { localStorage.setItem('pocket_price_show_buy_price', _showBuyPrice ? '1' : '0'); } catch(e) {}
  document.getElementById('not-paired').style.display = 'none';
  document.getElementById('app-shell').style.display = '';
}

// ── Search ────────────────────────────────────────────────────────────────────
var _debounce = null;

document.getElementById('search-input').addEventListener('input', function() {
  clearTimeout(_debounce);
  var val = this.value.trim();
  if (!val) {
    document.getElementById('results').innerHTML = '';
    showList();
    return;
  }
  _debounce = setTimeout(function() { doSearch(val); }, 300);
});

async function doSearch(q) {
  if (!_token) return;
  try {
    var res = await fetch('/api/price/search?q=' + encodeURIComponent(q), {
      headers: _priceHeaders()
    });
    if (res.status === 401) { showUnpaired(); return; }
    var data = await res.json();
    _lastResults = data.results || [];
    showList();
    renderList(_lastResults);
  } catch(e) {
    document.getElementById('results').innerHTML = '<p class="text-warning small">Offline or error.</p>';
  }
}

function renderList(items) {
  var el = document.getElementById('results');
  if (!items || items.length === 0) {
    el.innerHTML = '<p class="text-muted small mt-2">No products found.</p>';
    return;
  }
  el.innerHTML = items.map(function(p, idx) {
    var brand = escHtml(p.brand || '');
    var model = escHtml(p.model || '');
    var name = escHtml(p.name || '');
    var qtySub = (_showQty && p.qty_total != null) ? '<span class="ms-2 text-info">' + _qtyLabel + ': ' + Number(p.qty_total).toFixed(0) + '</span>' : '';
    return '<div class="result-list-item" onclick="selectProduct(' + idx + ')">' +
      '<div class="item-title">' + brand + ' ' + model + '</div>' +
      '<div class="item-sub">' + name + qtySub + '</div>' +
    '</div>';
  }).join('');
}

function selectProduct(idx) {
  var p = _lastResults[idx];
  if (!p) return;
  // Hide list, show detail
  document.getElementById('results').style.display = 'none';
  document.getElementById('back-btn').style.display = '';
  var detail = document.getElementById('price-detail');
  detail.style.display = '';
  var brand = escHtml(p.brand || '');
  var model = escHtml(p.model || '');
  var name = escHtml(p.name || '');
  var html = '<div class="price-card">' +
    '<div class="prod-name">' + brand + ' ' + model + '</div>' +
    '<div class="prod-sub">' + name + '</div>';
  if (_mode === 'FULL') {
    var fullPrices = [];
    if (p.price_wh10 != null) fullPrices.push(fmt(p.price_wh10));
    if (p.price_wh25 != null) fullPrices.push(fmt(p.price_wh25));
    html += '<div class="d-flex gap-3 mt-2 flex-wrap">' +
      fullPrices.map(function(v) { return '<div><div class="price-big">' + v + ' $</div></div>'; }).join('') +
    '</div>';
    if (_showBuyPrice && p.buy_price != null) {
      html += '<div class="mt-2 small text-warning">' + escHtml(_buyPriceLabel) + ': ' + fmt(p.buy_price) + ' $</div>';
    }
  } else {
    var wh25 = fmt(p.price_wh25);
    html += '<div class="mt-2"><div class="price-big">' + wh25 + ' $</div></div>';
  }
  if (_showQty && p.qty_total != null) {
    html += '<div class="mt-2 small text-info">' + _qtyLabel + ': ' + Number(p.qty_total).toFixed(0) + '</div>';
  }
  html += '</div>';
  detail.innerHTML = html;
}

function showList() {
  document.getElementById('price-detail').style.display = 'none';
  document.getElementById('price-detail').innerHTML = '';
  document.getElementById('results').style.display = '';
  document.getElementById('back-btn').style.display = 'none';
}

function fmt(v) { return v != null ? Number(v).toFixed(2) : '—'; }
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showUnpaired() {
  _token = '';
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('not-paired').style.display = '';
}

// ── Barcode scanning ──────────────────────────────────────────────────────────
async function startScan() {
  if (!window.isSecureContext) {
    setScanStatus('⚠️ HTTPS required for camera access.');
    return;
  }
  setScanStatus('Requesting camera…');
  document.getElementById('scanner-area').style.display = '';
  try {
    _stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    var video = document.getElementById('scanner-video');
    video.srcObject = _stream;
    setScanStatus('Scanning… point camera at barcode.');
    startBarcodeDetection(video);
  } catch(e) {
    setScanStatus('Camera error: ' + e.message);
    document.getElementById('scanner-area').style.display = 'none';
  }
}

function stopScan() {
  if (_scanInterval) { clearInterval(_scanInterval); _scanInterval = null; }
  if (_stream) { _stream.getTracks().forEach(function(t){ t.stop(); }); _stream = null; }
  document.getElementById('scanner-area').style.display = 'none';
  setScanStatus('');
}

function setScanStatus(msg) {
  document.getElementById('scan-status').textContent = msg;
}

function startBarcodeDetection(video) {
  if ('BarcodeDetector' in window) {
    var detector = new BarcodeDetector({formats: ['ean_13','ean_8','code_128','code_39','qr_code','upc_a','upc_e']});
    _scanInterval = setInterval(async function() {
      if (video.readyState < 2) return;
      try {
        var codes = await detector.detect(video);
        if (codes.length > 0) {
          var code = codes[0].rawValue;
          stopScan();
          await lookupBarcode(code);
        }
      } catch(e) {}
    }, 300);
  } else {
    setScanStatus('Barcode scanning not supported in this browser. Try Chrome on Android.');
  }
}

async function lookupBarcode(code) {
  setScanStatus('Looking up: ' + code);
  document.getElementById('search-input').value = code;
  try {
    var res = await fetch('/api/price/barcode?code=' + encodeURIComponent(code), {
      headers: _priceHeaders()
    });
    if (res.status === 401) { showUnpaired(); return; }
    if (res.status === 404) {
      await doSearch(code);
      setScanStatus('');
      return;
    }
    var data = await res.json();
    _lastResults = [data.product];
    renderList(_lastResults);
    selectProduct(0);
    setScanStatus('');
  } catch(e) {
    setScanStatus('Error: ' + e.message);
  }
}
</script>
</body>
</html>
