{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-7">
    <div class="bg-white p-3 rounded shadow-sm">
      <h4>Clients</h4>

      {% if request.query_params.get('msg') %}
        <div class="alert alert-info">{{ request.query_params.get('msg') }}</div>
      {% endif %}

      <table class="table table-sm">
        <thead>
  <tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Note</th>
    <th></th>
  </tr>
</thead>
<tbody>
  {% for c in clients %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.phone }}</td>
    <td>{{ c.note }}</td>
    <td class="text-end">
      <a class="btn btn-sm btn-outline-secondary" href="/clients/{{ c.id }}/edit">Edit</a>
    </td>
  </tr>
  {% endfor %}
</tbody>
      </table>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="bg-white p-3 rounded shadow-sm">
      <h4>Add client</h4>
      <form method="post" action="/clients/add">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input class="form-control" name="name" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Phone</label>
          <input class="form-control" name="phone" placeholder="+998 ...">
        </div>
        <div class="mb-2">
          <label class="form-label">Note</label>
          <textarea class="form-control" name="note" rows="3"></textarea>
        </div>
        <button class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
