{% extends "base.html" %}
{% block content %}
<div class="bg-white p-4 rounded shadow-sm text-center">
  <div class="mb-3">
    <span style="font-size:3rem;">✅</span>
  </div>
  <h4 class="mb-1">Purchase Invoice #{{ invoice.number }} — Done!</h4>
  <p class="text-muted mb-1">
    Supplier: <strong>{{ invoice.supplier or '—' }}</strong>
  </p>
  <p class="text-muted mb-3">
    Stock received into: <strong>{{ invoice.destination_warehouse }}</strong>
  </p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="/receive/xlsx/view?n={{ invoice.id }}" class="btn btn-outline-primary">
      &#128065; View XLSX
    </a>
    <a href="/receive/xlsx?n={{ invoice.id }}" class="btn btn-success">
      &#11015; Download XLSX
    </a>
    <a href="/receive" class="btn btn-outline-secondary">
      New Receive
    </a>
  </div>
</div>
{% endblock %}
